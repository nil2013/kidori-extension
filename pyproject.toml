[project]
name = "kidori"
version = "0.1.0"
description = "規格材の木取り図・加工指示図ジェネレータ"
readme = "README.md"
authors = [
    { name = "Tomoumi NISHIMURA", email = "lue.gsk.2012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.0",
    "jsonschema>=4.26.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
kidori = "kidori:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
